    <h1>Exercise 8.1 – Enabling and Disabling JavaScript</h1>
    <p>Kiểm tra JavaScript đang bật hay tắt bằng script và noscript.</p>
    <script>
      document.write("<p>You have JavaScript enabled</p>");
    </script>
    <noscript><p>You have JavaScript disabled</p></noscript>
    <p>
      Tắt JavaScript trong cài đặt trang của trình duyệt rồi tải lại để xem
      trạng thái còn lại.
    </p>
