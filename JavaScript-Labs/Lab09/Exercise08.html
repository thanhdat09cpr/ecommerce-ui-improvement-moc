<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../css/lab-nav.css" />
    <meta charset="utf-8" />
    <title>Exercise 9.8 – Form Validation</title>
    <link rel="stylesheet" type="text/css" href="css/lab09.css" />
    <link rel="stylesheet" type="text/css" href="../css/fontawesome.min.css" />

    <script type="text/javascript" src="js/Exercise08.js"></script>
  </head>
  <body class="form-body">
    <nav class="lab-nav">
      <a href="index.html">Lab 09</a> / Exercise 9.8 – Form Validation
    </nav>

    <div class="form-box">
      <h1>Registration</h1>

      <form method="get" action="#" id="sampleForm">
        <hr />
        <label id="icon" for="name"><i class="fa fa-user fa-fw"></i></label>
        <input type="text" name="name" id="name" placeholder="Name" />
        <label id="icon" for="email"><i class="fa fa-phone fa-fw"></i></label>
        <input type="text" name="phone" id="phone" placeholder="Phone" />
        <label id="icon" for="email"
          ><i class="fa fa-envelope fa-fw"></i
        ></label>
        <input type="text" name="email" id="email" placeholder="Email" />
        <label id="icon" for="pass"><i class="fa fa-key fa-fw"></i></label>
        <input type="password" id="pass" placeholder="Password" />

        <button type="submit">
          <i class="fa fa-reply fa-fw"></i> Register
        </button>
      </form>
    </div>

    <div id="errors" class="visible"></div>
  </body>
</html>
